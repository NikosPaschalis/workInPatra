name: Corporate API validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Corporate isolated unit tests
        run: node --test test/corporate.test.js
  live:
    if: github.event_name == 'workflow_dispatch' && vars.SMARTRECRUITERS_REUSE_AUTHORIZED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Authorized public API read-only validation
        env:
          SMARTRECRUITERS_REUSE_AUTHORIZED: ${{ vars.SMARTRECRUITERS_REUSE_AUTHORIZED }}
        run: node scripts/corporate-smoke.js
