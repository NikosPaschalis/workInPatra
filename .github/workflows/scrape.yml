name: Scrape Jobs
on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Snapshot previous jobs.json (for diff)
        run: |
          mkdir -p /tmp/prev
          if [ -f data/jobs.json ]; then
            cp data/jobs.json /tmp/prev/jobs.json
            echo "Saved previous snapshot ($(wc -c < /tmp/prev/jobs.json) bytes)"
          else
            echo "No previous data/jobs.json — treating all scraped jobs as new"
            echo '{"jobs":[]}' > /tmp/prev/jobs.json
          fi

      - name: Random delay (only on scheduled runs)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 90))
          echo "Sleeping ${DELAY}s to break the cron pattern"
          sleep $DELAY

      - name: Run scrapers
        timeout-minutes: 20
        run: node scripts/scrape.js

      - name: Commit & push data/jobs.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git diff --staged --quiet \
            && echo "⏭  No changes — skipping commit" \
            || (git commit -m "chore: update jobs.json" && git push)

      - name: Notify Telegram and Facebook about new jobs
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID:    ${{ secrets.FACEBOOK_PAGE_ID }}
        run: node scripts/notify-telegram.js /tmp/prev/jobs.json
