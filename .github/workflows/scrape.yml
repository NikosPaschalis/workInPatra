name: Scrape Jobs
on:
  schedule:
    # Other sources keep both existing times. The schedule string identifies the Kariera slot.
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Kariera paused until manually re-enabled after recovery tests (planned 2026-11-25).
  # JobFind/XE and verified Kariera queue continue normally.
  KARIERA_PAUSE_UNTIL: '2099-01-01T00:00:00Z'

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Snapshot previous jobs.json (for diff)
        run: |
          mkdir -p /tmp/prev
          if [ -f data/jobs.json ]; then
            cp data/jobs.json /tmp/prev/jobs.json
            echo "Saved previous snapshot ($(wc -c < /tmp/prev/jobs.json) bytes)"
          else
            echo "No previous data/jobs.json — treating all scraped jobs as new"
            echo '{"jobs":[]}' > /tmp/prev/jobs.json
          fi

      - name: Random delay (only on scheduled runs)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 90))
          echo "Sleeping ${DELAY}s to break the cron pattern"
          sleep $DELAY

      - name: Run scrapers
        timeout-minutes: 20
        env:
          KARIERA_CRON: ${{ github.event.schedule }}
          CORPORATE_CAREERS_ENABLED: ${{ vars.CORPORATE_CAREERS_ENABLED }}
          SMARTRECRUITERS_REUSE_AUTHORIZED: ${{ vars.SMARTRECRUITERS_REUSE_AUTHORIZED }}
        run: node scripts/scrape.js

      - name: Apply verified Kariera queue to the same nightly jobs batch
        run: node scripts/apply-curated-kariera.js

      - name: Apply verified desktop queue to the same jobs batch
        run: node scripts/apply-manual-pending.js

      - name: Commit & push data/jobs.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/observations.jsonl data/scrape-runs.jsonl data/kariera-pending.json data/manual-pending.json
          git diff --staged --quiet \
            && echo "⏭  No changes — skipping commit" \
            || (git commit -m "chore: update jobs.json" && git push)

      - name: Notify Telegram and Facebook about new jobs
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID:    ${{ secrets.FACEBOOK_PAGE_ID }}
        run: node scripts/notify-telegram.js /tmp/prev/jobs.json

      - name: Notify about direct employer listings
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: node scripts/notify-direct-jobs.js

      - name: Persist direct notification ledger
        if: always()
        run: |
          git add data/direct-notifications.json data/notification-ledger.json
          git diff --staged --quiet \
            && echo "No new direct notification receipts" \
            || (git commit -m "chore: record direct listing notifications" && git push)
