name: Monthly Snapshot

on:
  schedule:
    # Runs at 09:00 UTC on the 1st of every month
    # (after the 06:00 scrape has already updated jobs.json)
    - cron: '0 9 1 * *'
  workflow_dispatch: # manual trigger for testing

permissions:
  contents: write

concurrency:
  group: monthly-snapshot-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check data quality before snapshot
        run: node scripts/data-quality.js data

      - name: Generate monthly snapshot
        run: node scripts/snapshot.js --monthly

      - name: Validate snapshot and reporting inputs
        run: node scripts/data-quality.js data

      - name: Generate monthly labour reports
        run: node scripts/labour-reports.js --publication-date "$(TZ=Europe/Athens date +%F)"

      - name: Commit & push snapshot and reports
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- data/snapshots/ reports/ report.html sitemap.xml
          if git diff --staged --quiet; then
            echo "No new snapshot or report edits"
          else
            git commit -m "chore: publish monthly snapshot and labour reports"
            git push || (git pull --rebase origin main && git push)
          fi
