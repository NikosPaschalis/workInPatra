name: Workable read-only pilot
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/scrapers/workable.js'
      - '.github/workflows/workable-pilot.yml'
permissions:
  contents: read
jobs:
  pilot:
    if: github.head_ref == 'feat/corporate-careers'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test test/workable.test.js
      - run: node scripts/workable-smoke.js
