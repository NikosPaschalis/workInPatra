name: Kariera live smoke test

on:
  push:
    branches:
      - "fix/**"
    paths:
      - "server/scrapers/kariera.js"
      - "scripts/kariera-live-smoke.js"
      - ".github/workflows/kariera-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fetch live Kariera page and validate parsed listings
        run: node scripts/kariera-live-smoke.js
