name: Company HTML read-only pilot
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/scrapers/company-html.js'
      - '.github/workflows/company-html-pilot.yml'
permissions:
  contents: read
jobs:
  pilot:
    if: github.head_ref == 'feat/corporate-careers'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps --only-shell chromium
      - run: node --test test/company-html.test.js
      - run: node scripts/company-html-smoke.js
