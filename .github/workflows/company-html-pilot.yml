name: Company HTML read-only pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    if: vars.CORPORATE_CAREERS_ENABLED == 'true' && vars.HTML_APPROVED_COMPANIES != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      CORPORATE_CAREERS_ENABLED: ${{ vars.CORPORATE_CAREERS_ENABLED }}
      HTML_APPROVED_COMPANIES: ${{ vars.HTML_APPROVED_COMPANIES }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps --only-shell chromium
      - run: node --test test/company-html.test.js
      - run: node scripts/company-html-smoke.js
